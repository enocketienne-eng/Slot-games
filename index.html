<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gold Rush Slots</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="game-wrapper">

    <!-- Header -->
    <div class="game-header">
      <h1>Gold Rush</h1>
      <p class="subtitle">Strike it rich on the frontier!</p>
    </div>

    <!-- Reel section -->
    <div class="reel-section">
      <div class="reel-frame">
        <!-- Win banner slides in over reels -->
        <div class="win-banner" id="winBanner">
          <div class="win-banner-label" id="winBannerLabel">WIN!</div>
          <div class="win-banner-amount" id="winBannerAmount"></div>
        </div>
        <canvas id="reelCanvas"></canvas>
      </div>
    </div>

    <!-- Balance bar -->
    <div class="balance-bar">
      <div class="balance-item">
        <span class="balance-label">Balance</span>
        <span class="balance-value" id="balanceDisplay">1000</span>
      </div>
      <div class="balance-item">
        <span class="balance-label">Last Win</span>
        <span class="balance-value" id="lastWinDisplay">—</span>
      </div>
      <div class="balance-item">
        <span class="balance-label">Bet</span>
        <span class="balance-value" id="betDisplayTop">1</span>
      </div>
    </div>

    <!-- Bonus badge -->
    <div class="bonus-badge" id="bonusBadge">FREE SPINS — ×2</div>

    <!-- Control bar -->
    <div class="control-bar">
      <div class="bet-group">
        <span class="bet-label">Bet</span>
        <button class="btn-adj" id="betDown" aria-label="Decrease bet">−</button>
        <span class="bet-display" id="betValue">1</span>
        <button class="btn-adj" id="betUp" aria-label="Increase bet">+</button>
      </div>

      <button class="btn-max-bet" id="maxBet">MAX</button>

      <div class="spin-btn-wrap">
        <button class="btn-spin" id="spinBtn" aria-label="Spin reels">SPIN</button>
      </div>
    </div>

    <!-- Secondary bar: stats + paytable toggle -->
    <div class="secondary-bar">
      <span class="stats-text" id="statsBar">Spins: 0 | Spent: 0 | Won: 0 | RTP: —</span>
      <button class="btn-paytable" id="paytableToggle">▼ PAYTABLE</button>
    </div>

    <!-- Paytable -->
    <div class="paytable-panel" id="paytablePanel">
      <div class="paytable-title">Paytable · Multiplier × Bet</div>
      <div class="pt-grid" id="ptGrid"></div>
      <p style="font-family:'Roboto Slab',serif;font-size:0.68rem;color:#7a5c30;text-align:center;margin-top:10px;">
        Wild substitutes all symbols except Scatter &nbsp;·&nbsp;
        3+ Scatters anywhere = 10 Free Spins (×2 multiplier)
      </p>
    </div>

  </div>

  <script src="js/symbols.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/winDetection.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/game.js"></script>
  <script>
    // ── Init ──────────────────────────────────────────────
    const canvas = document.getElementById('reelCanvas');
    const renderer = new Renderer(canvas);
    renderer.drawGrid(renderer.grid, [], 0);

    const game = new GoldRushGame(renderer);

    // ── DOM refs ──────────────────────────────────────────
    const balanceEl    = document.getElementById('balanceDisplay');
    const betValueEl   = document.getElementById('betValue');
    const betTopEl     = document.getElementById('betDisplayTop');
    const lastWinEl    = document.getElementById('lastWinDisplay');
    const spinBtn      = document.getElementById('spinBtn');
    const statsBar     = document.getElementById('statsBar');
    const bonusBadge   = document.getElementById('bonusBadge');
    const winBanner    = document.getElementById('winBanner');
    const winBannerLabel  = document.getElementById('winBannerLabel');
    const winBannerAmount = document.getElementById('winBannerAmount');

    let bannerTimer = null;

    // ── Win banner ────────────────────────────────────────
    function showBanner(label, amount, tier) {
      winBannerLabel.textContent = label;
      winBannerAmount.textContent = `${amount} COINS`;
      winBanner.className = 'win-banner visible' + (tier === 'mega' ? ' mega-win' : tier === 'big' ? ' big-win' : '');
      if (bannerTimer) clearTimeout(bannerTimer);
      const duration = tier === 'mega' ? 4000 : tier === 'big' ? 3000 : 2200;
      bannerTimer = setTimeout(hideBanner, duration);
    }

    function hideBanner() {
      winBanner.className = 'win-banner';
    }

    // ── Stats update ──────────────────────────────────────
    function updateUI() {
      const s = game.getStats();
      balanceEl.textContent = s.balance;
      betValueEl.textContent = s.bet;
      betTopEl.textContent = s.bet;
      statsBar.textContent = `Spins: ${s.spinCount} | Spent: ${s.totalSpent} | Won: ${s.totalWon} | RTP: ${s.rtp}%`;
    }

    // ── Game callbacks ────────────────────────────────────
    game.onBalanceChange = (bal) => { balanceEl.textContent = bal; };

    game.onSpin = () => {
      spinBtn.disabled = true;
      spinBtn.classList.add('spinning');
      spinBtn.textContent = '...';
      hideBanner();
      lastWinEl.textContent = '—';
      updateUI();
    };

    game.onWin = (wins, payout) => {
      lastWinEl.textContent = payout;
      lastWinEl.classList.add('win-flash');
      setTimeout(() => lastWinEl.classList.remove('win-flash'), 1800);

      // Determine win tier for banner (Big Win = 20x bet, Mega Win = 50x bet)
      const multiplier = payout / game.bet;
      let tier = 'normal', label = 'WIN!';
      if (multiplier >= 50) { tier = 'mega'; label = '💰 MEGA WIN! 💰'; }
      else if (multiplier >= 20) { tier = 'big'; label = '★ BIG WIN! ★'; }

      showBanner(label, payout, tier);
      updateUI();
    };

    game.onFreeSpinsTriggered = (count, mult) => {
      bonusBadge.textContent = `FREE SPINS: ${count} remaining (×${mult})`;
      bonusBadge.classList.add('active');
      showBanner(`FREE SPINS TRIGGERED!`, `${count} SPINS × ${mult}`, 'big');
    };

    game.onFreeSpinsUpdate = (remaining) => {
      bonusBadge.textContent = `FREE SPINS: ${remaining} remaining (×${game.freeSpinsMultiplier})`;
    };

    game.onFreeSpinsComplete = () => {
      bonusBadge.classList.remove('active');
      showBanner('Free Spins Complete!', game.totalWon, 'normal');
    };

    // ── Bet controls ──────────────────────────────────────
    document.getElementById('betDown').addEventListener('click', () => {
      game.setBet(game.bet - 1);
      updateUI();
    });
    document.getElementById('betUp').addEventListener('click', () => {
      game.setBet(game.bet + 1);
      updateUI();
    });
    document.getElementById('maxBet').addEventListener('click', () => {
      game.setBet(50);
      updateUI();
    });

    // ── Spin ──────────────────────────────────────────────
    async function doSpin() {
      if (!game.canSpin()) return;
      await game.spin();
      spinBtn.disabled = false;
      spinBtn.classList.remove('spinning');
      spinBtn.textContent = game.inBonusRound ? 'FREE' : 'SPIN';

      if (!game.inBonusRound && game.balance < game.bet) {
        spinBtn.disabled = true;
        showBanner('Out of Coins!', 'Refresh to restart', 'normal');
      }
      updateUI();
    }

    spinBtn.addEventListener('click', doSpin);

    // Spacebar shortcut (§5 spec)
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !e.repeat && game.canSpin()) {
        e.preventDefault();
        doSpin();
      }
    });

    // ── Paytable ──────────────────────────────────────────
    const ptGrid = document.getElementById('ptGrid');
    Object.entries(PAYTABLE).forEach(([id, pays]) => {
      const sym = Object.values(SYMBOLS).find(s => s.id === id);
      if (!sym) return;
      const shapeChar = { star:'★', diamond:'◆', rect:'▬', circle:'●', cross:'✚', horseshoe:'∪', hat:'⌂', square:'■' };
      const row = document.createElement('div');
      row.className = 'pt-row';
      row.innerHTML = `<span class="pt-sym" style="color:${sym.color}">${shapeChar[sym.shape]||'•'} ${sym.label}</span>
        <span class="pt-vals">${pays[3]}× · ${pays[4]}× · ${pays[5]}×</span>`;
      ptGrid.appendChild(row);
    });

    document.getElementById('paytableToggle').addEventListener('click', function () {
      const panel = document.getElementById('paytablePanel');
      panel.classList.toggle('open');
      this.textContent = panel.classList.contains('open') ? '▲ PAYTABLE' : '▼ PAYTABLE';
    });

    // ── Initial render ────────────────────────────────────
    updateUI();
  </script>
</body>
</html>
